<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Marked.js for Markdown parsing & Html2Pdf for PDF download -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        /* --- Professional A4 Paper Styling for Resume --- */
        .resume-paper {
            background: #ffffff !important;
            color: #1e293b !important;
            padding: 40px 50px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }

        .resume-paper h1 {
            color: #0f172a;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 8px;
        }

        .resume-paper h2 {
            color: #1e40af;
            font-size: 18px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .resume-paper h3 {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            margin-top: 10px;
        }

        .resume-paper p, .resume-paper li {
            font-size: 14px;
            color: #334155;
        }

        .resume-paper ul {
            padding-left: 20px;
            margin-bottom: 10px;
        }

        .resume-paper hr {
            border-top: 1px solid #cbd5e1;
            margin: 15px 0;
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📄 AI Professional Resume Builder</h2>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
    </div>

    <div class="row">
        <!-- Input Form Section -->
        <div class="col-lg-5 mb-4">
            <div class="form-card">
                <h4 class="mb-3 text-info">Enter Your Details</h4>
                <form method="POST" action="/resume-builder">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Devesh Gupta" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="name@email.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 9876543210" required>
                        </div>
                    </div>
                    <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">LinkedIn URL (Optional)</label>
                        <input type="url" name="linkedin" class="form-control" placeholder="linkedin.com/in/username">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">GitHub / Portfolio (Optional)</label>
                        <input type="url" name="github" class="form-control" placeholder="github.com/username">
                    </div>
                </div>
                    <div class="mb-3">
                        <label class="form-label">Target Role</label>
                        <input type="text" name="target_role" class="form-control" placeholder="e.g. Machine Learning Engineer" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Skills (Comma Separated)</label>
                        <input type="text" name="skills" class="form-control" placeholder="Python, SQL, React, Machine Learning" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Education</label>
                        <textarea name="education" class="form-control" rows="2" placeholder="B.Tech in CSE - XYZ University (2022-2026)"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Work Experience / Internships</label>
                        <textarea name="experience" class="form-control" rows="3" placeholder="Mention roles, companies, and achievements"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Key Projects</label>
                        <textarea name="projects" class="form-control" rows="3" placeholder="Project name and short description"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">✨ Generate Resume</button>
                </form>
            </div>
        </div>

        <!-- Resume Preview & PDF Download Section -->
        <div class="col-lg-7">
            {% if resume %}
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h4 class="text-success m-0">Generated Resume Preview</h4>
                <button onclick="downloadPDF()" class="btn btn-danger btn-sm px-3">
                    📥 Download PDF
                </button>
            </div>

            <!-- Styled White A4 Paper Sheet -->
            <div id="resumeContainer" class="resume-paper">
                <!-- Raw markdown will be injected & parsed here -->
                <div id="rawMarkdown" style="display: none;">{{ resume }}</div>
                <div id="parsedResume"></div>
            </div>
            {% else %}
            <div class="form-card text-center py-5 text-muted">
                <p class="m-0">👈 Fill out the details on the left and click <b>Generate Resume</b> to create your professional resume.</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
    // 1. Render Markdown into Clean Styled HTML
    document.addEventListener("DOMContentLoaded", function () {
        const rawElement = document.getElementById("rawMarkdown");
        const targetElement = document.getElementById("parsedResume");

        if (rawElement && targetElement) {
            const rawText = rawElement.innerText;
            targetElement.innerHTML = marked.parse(rawText);
        }
    });

    // 2. Export Rendered Resume as PDF
    function downloadPDF() {
        const element = document.getElementById('resumeContainer');
        const opt = {
            margin:       [0.3, 0.4, 0.3, 0.4],
            filename:     'Professional_Resume.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
