<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <!-- Marked.js for Markdown Formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
        }

        /* Full Width Main Layout */
        .main-container {
            width: 100%;
            max-width: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            margin-bottom: 10px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
            margin-top: 5px;
        }

        /* Upload Form Card */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-submit {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        /* Interactive Report Styling */
        #report-section {
            display: none;
        }

        .report-header {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        #report-content {
            line-height: 1.8;
            font-size: 15px;
            color: #e2e8f0;
        }

        /* Headings Inside Markdown Report */
        #report-content h3 {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            padding: 12px 18px;
            border-left: 4px solid #38bdf8;
            border-radius: 6px;
            margin-top: 24px;
            margin-bottom: 14px;
            font-size: 18px;
        }

        #report-content h4 {
            color: #f1f5f9;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        /* Bullet Points as Interactive Cards */
        #report-content ul, #report-content ol {
            padding-left: 0;
            list-style: none;
            margin-bottom: 16px;
        }

        #report-content li {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        #report-content li:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        /* Bold Text & Keywords Highlight */
        #report-content strong {
            color: #60a5fa;
        }

        #report-content code {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>📄 AI Resume Analyzer</h1>
            <p>Upload your resume PDF to get instant ATS Feedback & Score.</p>
        </div>

        <!-- Form Section -->
        <div class="card">
            <form id="analyzer-form">
                <div class="form-group">
                    <label for="target_role">Target Job Role</label>
                    <input type="text" id="target_role" name="target_role" class="form-control" placeholder="e.g. Web Developer, Python Developer" required>
                </div>

                <div class="form-group">
                    <label for="resume">Select Resume PDF</label>
                    <input type="file" id="resume" name="resume" accept=".pdf" class="form-control" required>
                </div>

                <button type="submit" class="btn-submit">Analyze Resume</button>
                <div id="loader" class="loader">⏳ Extracting text & Analyzing ATS Score... Please wait.</div>
            </form>
        </div>

        <!-- Interactive Report Section -->
        <div id="report-section" class="card">
            <h2 id="report-title" class="report-header">Report</h2>
            <div id="report-content"></div>
        </div>
    </div>

    <script>
        document.getElementById('analyzer-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const loader = document.getElementById('loader');
            const reportSection = document.getElementById('report-section');
            const reportContent = document.getElementById('report-content');
            const reportTitle = document.getElementById('report-title');

            loader.style.display = 'block';
            reportSection.style.display = 'none';

            try {
                const response = await fetch('/resume', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loader.style.display = 'none';

                if (response.ok) {
                    reportTitle.innerText = `Report for: ${data.filename} (${data.target_role})`;
                    
                    // 1. Convert Markdown to HTML
                    let htmlResult = marked.parse(data.report);

                    // 2. Score ko Graphical Badge Card mein convert karein
                    htmlResult = htmlResult.replace(
                        /Score:\s*(\d+)\s*\/\s*100/i,
                        `<div style="display:inline-block; background: linear-gradient(135deg, #0284c7, #2563eb); padding: 14px 28px; border-radius: 12px; font-weight: bold; font-size: 22px; color: #fff; margin: 15px 0; box-shadow: 0 4px 18px rgba(2, 132, 199, 0.4);">
                            🎯 ATS Score: $1 / 100
                         </div>`
                    );

                    reportContent.innerHTML = htmlResult;
                    reportSection.style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                loader.style.display = 'none';
                alert('Something went wrong! Check server console.');
            }
        });
    </script>

</body>
</html>
