<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Career Guidance{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styling */
        .navbar {
            background: #1e293b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .logout-btn {
            background: #ef4444;
            color: white !important;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Common Card Component */
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: #0f172a;
            color: #64748b;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Global Navigation Bar -->
    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}" class="logo">🎯 AI Career Portal</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('resume') }}">Resume Analyzer</a></li>
            <li><a href="{{ url_for('skill_gap') }}">Skill Gap</a></li>
            <li><a href="{{ url_for('roadmap') }}">Roadmap</a></li>
            <li><a href="{{ url_for('chatbot') }}">AI Assistant</a></li>
            <li><a href="{{ url_for('history') }}">History</a></li>
            <li><a href="{{ url_for('profile') }}">Profile</a></li>
            <li><a href="{{ url_for('logout') }}" class="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <!-- Page Specific Content -->
    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        © 2026 AI Smart Career Guidance System | All Rights Reserved
    </footer>

</body>
</html>
