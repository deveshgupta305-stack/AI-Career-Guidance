<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: #0b1120; color: #f8fafc; min-height: 100vh; }
        
        /* Sidebar Styling */
        .sidebar { width: 250px; background-color: #0f172a; padding: 20px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; gap: 20px; }
        .sidebar h2 { color: #38bdf8; font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #1e293b; color: #38bdf8; }
        
        /* Main Content Styling */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 25px; border: 1px solid #334155; margin-bottom: 25px; }
        .btn { background-color: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <!-- Common Sidebar -->
    <div class="sidebar">
        <h2>🚀 AI Career</h2>
        <a href="/dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="/resume"><i class="fa-solid fa-file-lines"></i> Resume Analyzer</a>
        <a href="/skill-gap"><i class="fa-solid fa-layer-group"></i> Skill Gap</a>
        <!-- layout.html me ye line change karein -->
        <a href="/chatbot"><i class="fa-solid fa-robot"></i> AI Assistant</a>
    </div>

    <!-- Dynamic Content Area -->
    <div class="main-content">
        {% block content %}
        <!-- Sub-pages code will render here -->
        {% endblock %}
    </div>

</body>
</html>
